<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seestar Scale Matcher</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; line-height: 1.4; }
  h1 { font-size: 1.4rem; }
  .box { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin: 16px 0; }
  label { display: inline-block; min-width: 140px; margin: 6px 0; }
  select, input[type=file], button { font-size: 1rem; padding: 6px 12px; }
  button { margin-top: 12px; }
  #status { margin-top: 14px; color: #333; }
  #preview { max-width: 100%; margin-top: 12px; }
  .note { font-size: 0.9rem; color: #555; }
</style>
</head>
<body>
  <h1>Seestar Image Scale Matcher</h1>
  <p>Rescales images so the plate scale matches between S50, S50 Pro, S30, and S30 Pro (all use 2.9 μm telephoto pixels).</p>

  <div class="box">
    <div>
      <label for="source">Source model:</label>
      <select id="source">
        <option value="250">Seestar S50 (250 mm)</option>
        <option value="260" selected>Seestar S50 Pro (260 mm)</option>
        <option value="150">Seestar S30 (150 mm)</option>
        <option value="160">Seestar S30 Pro (160 mm)</option>
      </select>
    </div>
    <div>
      <label for="target">Target model:</label>
      <select id="target">
        <option value="250" selected>Seestar S50 (250 mm)</option>
        <option value="260">Seestar S50 Pro (260 mm)</option>
        <option value="150">Seestar S30 (150 mm)</option>
        <option value="160">Seestar S30 Pro (160 mm)</option>
      </select>
    </div>
    <div>
      <label for="file">Image file:</label>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
    </div>
    <button id="go" disabled>Rescale & Download</button>
    <div id="status"></div>
    <img id="preview" alt="Preview of rescaled image" style="display:none;">
  </div>

  <p class="note">
    Scale factor = target FL / source FL (exact floating-point).<br>
    High-quality canvas resampling is used. Aspect ratio is preserved.
  </p>

<script>
const models = {
  "250": "S50",
  "260": "S50Pro",
  "150": "S30",
  "160": "S30Pro"
};

const sourceSel = document.getElementById('source');
const targetSel = document.getElementById('target');
const fileInput = document.getElementById('file');
const goBtn = document.getElementById('go');
const status = document.getElementById('status');
const preview = document.getElementById('preview');

fileInput.addEventListener('change', () => {
  goBtn.disabled = !fileInput.files.length;
  preview.style.display = 'none';
  status.textContent = '';
});

goBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  const flSource = parseFloat(sourceSel.value);
  const flTarget = parseFloat(targetSel.value);
  const scale = flTarget / flSource;

  if (scale === 1) {
    status.textContent = 'Source and target are the same — no rescale needed.';
    return;
  }

  status.textContent = 'Loading image…';
  goBtn.disabled = true;

  try {
    const img = await loadImage(file);
    const newW = Math.round(img.width * scale);
    const newH = Math.round(img.height * scale);

    status.textContent = `Rescaling ${img.width}×${img.height} → ${newW}×${newH} (×${scale.toFixed(8)})…`;

    const canvas = document.createElement('canvas');
    canvas.width = newW;
    canvas.height = newH;
    const ctx = canvas.getContext('2d');

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, newW, newH);

    preview.src = canvas.toDataURL('image/jpeg', 0.95);
    preview.style.display = 'block';

    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const base = file.name.replace(/\.[^.]+$/, '');
      const srcName = models[sourceSel.value];
      const tgtName = models[targetSel.value];
      a.href = url;
      a.download = `${base}_${srcName}_to_${tgtName}.jpg`;
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = `Done. Downloaded ${newW}×${newH} image (scale ×${scale.toFixed(6)}).`;
      goBtn.disabled = false;
    }, 'image/jpeg', 0.95);

  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    goBtn.disabled = false;
  }
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not load image'));
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>
